<!DOCTYPE html>
<html>
<head>
  <!--
    /app/ is replaced by the value of `--base-href` at build
    time (e.g. "/kinn/" when served from GitHub Pages).
  -->
  <base href="/app/">
  <meta charset="UTF-8">
  <!--
    The decrypted master key lives in this page's memory (ADR 0002): only
    our own code may run, and it may only talk to our Supabase project.
    'wasm-unsafe-eval' is for CanvasKit and libsodium (WebAssembly);
    fonts.gstatic.com serves Flutter's fallback fonts for missing glyphs.
    Built with --no-web-resources-cdn --csp, so CanvasKit is served from here.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://qvphnekcdnrczxkabyrs.supabase.co wss://qvphnekcdnrczxkabyrs.supabase.co https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kinn - your goals, habits and feelings in one place.">

  <meta name="mobile-web-app-capable" content="yes">
  <!-- The page runs under the status bar; #kinn-app stops at it and the
       strip shows the app's background (see kinn_chrome.js). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FBFAFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13101F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Kinn">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kinn</title>
  <link rel="manifest" href="manifest.json">
  <!-- libsodium (sumo) for package:sodium; loaded before the Flutter bootstrap. -->
  <script src="sodium.js"></script>
  <script src="kinn_chrome.js"></script>
  <style>
    :root { --kinn-top: #FBFAFF; --kinn-bottom: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --kinn-top: #13101F; --kinn-bottom: #1E1A31; }
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(var(--kinn-top) 50%, var(--kinn-bottom) 50%);
    }
    #kinn-app {
      position: fixed;
      top: env(safe-area-inset-top, 0);
      right: env(safe-area-inset-right, 0);
      bottom: env(safe-area-inset-bottom, 0);
      left: env(safe-area-inset-left, 0);
    }
  </style>
</head>
<body>
  <div id="kinn-app"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
